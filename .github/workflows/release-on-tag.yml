name: Release Package On Tag

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.5.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure npm for GitHub Packages (scoped)
        run: |
          echo "@${{ github.repository_owner }}:registry=https://npm.pkg.github.com/" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc
          npm config list
          npm whoami --registry=https://npm.pkg.github.com || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Debug package identity
        run: |
          node -p "require('./package.json').name"
          node -p "require('./package.json').version"
          npm pkg get name version

      - name: Verify Tag Matches Package Version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag '$TAG_NAME' does not match package.json version '$PACKAGE_VERSION'."
            exit 1
          fi

      - name: Build Library
        run: pnpm build:lib

      - name: Publish To GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --registry=https://npm.pkg.github.com/
